# ============================================================
# TalentLedger — Development Profile
# ============================================================

spring:
  config:
    activate.on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/talentledger_dev?prepareThreshold=0
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  flyway:
    url: jdbc:postgresql://localhost:5432/talentledger_dev
    user: postgres
    password: postgres

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

  # Dev-friendly — disable security for rapid iteration (enable per-module)
  # Do NOT set this to "none" in prod
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

talentledger:
  auth:
    native-auth-enabled: true
    mfa-enabled: false
    session-ttl-hours: 168

  storage:
    provider: LOCAL
    local:
      path: ./uploads

  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173

  parsing:
    temp-file-ttl-hours: 1

logging:
  level:
    root: INFO
    com.talentledger: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: INFO
