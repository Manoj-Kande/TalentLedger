# ============================================================
# TalentLedger — Local Profile
# For local dev against a local PostgreSQL instance.
# Flyway is ENABLED — runs migrations on startup.
# ============================================================

spring:
  config:
    activate.on-profile: local

  # ── PostgreSQL (local dev defaults to localhost) ──────────
  #    Override with env vars: DB_URL, DB_USER, DB_PASS
  #    For Neon, set: DB_URL=jdbc:postgresql://<host>/<db>?sslmode=require&prepareThreshold=0
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/talentledger?prepareThreshold=0}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 600000
      pool-name: talentledger-hikari
      data-source-properties:
        prepareThreshold: 0
        reWriteBatchedInserts: true

  # ── Flyway (runs migrations on startup) ──────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    url: ${FLYWAY_URL:${DB_URL}}
    user: ${FLYWAY_USER:${DB_USER}}
    password: ${FLYWAY_PASS:${DB_PASS}}

  # ── JPA / Hibernate ──────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        types.print.banner: false
        statistics: false
        generate_statistics: false

  # ── Spring Security is fully disabled for local so requests reach controllers
  #     without the framework returning a bare 401 first.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  # ── Servlet ─────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 0

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

talentledger:
  auth:
    native-auth-enabled: true
    mfa-enabled: false
    session-ttl-hours: 168

  storage:
    provider: LOCAL
    local:
      path: ./uploads

  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173

  parsing:
    temp-file-ttl-hours: 1

# Logging is fully controlled by logback-spring.xml's <springProfile name="local"> block:
# console stays at WARN+ only, full DEBUG detail goes to ./logs/*.log files.
